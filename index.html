<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Make a grid of your favourite albums, EPs, artists, movies and games." />

    <!-- Social preview; __SITE_URL__ is filled in at build time (see vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shelfie" />
    <meta property="og:title" content="Shelfie — your favourites, on one shelf" />
    <meta property="og:description" content="Make a grid of your favourite albums, EPs, artists, movies and games. Share it or download it as an image." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shelfie — a grid of favourites with Shelf-bot, the mascot" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shelfie — your favourites, on one shelf" />
    <meta name="twitter:description" content="Make a grid of your favourite albums, EPs, artists, movies and games." />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@500;700&family=Space+Grotesk:wght@400;600;700&family=Tektur:wght@500;700;800;900&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <!-- UI font (not used inside exported grids) -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#e7e7e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <title>Shelfie — favourites grid</title>
    <script>
      try {
        const t = localStorage.getItem('shelfie:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
